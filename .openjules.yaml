# Base Docker image to spawn for the sandbox runtime
image: "python:3.11-slim"

# Commands executed inside the container to prepare the repository environment
setup:
  - pip install --no-cache-dir -r requirements.txt 2>/dev/null || true
  - pip install --no-cache-dir -e . 2>/dev/null || true

# Test command used by OpenJules to verify changes before opening a PR / Patch
test_command: "pytest"

# Environment variables or secrets to inject into sandbox tasks
env:
  PYTHONUNBUFFERED: "1"
  CI: "true"

# LLM inference server configuration (self-hosted or cloud)
llm:
  # Model name (e.g. 'openai/Qwen/Qwen2.5-Coder-7B-Instruct' or 'gpt-4o')
  model: "gpt-4o"
  # Optional base URL for local servers (e.g. 'http://vllm:8000/v1' or 'http://llamacpp:8080/v1')
  api_base: null
  api_key: "EMPTY"
  temperature: 0.2
  max_tokens: 4096

# Keystone Polyphony multi-agent coordination settings
polyphony:
  enabled: true
  swarm_key: null  # Optional override

# Execution timeout in seconds
timeout_seconds: 900
